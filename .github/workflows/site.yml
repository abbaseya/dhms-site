# Checks the translation files and builds the site on every pull request and
# every push to main. It does not deploy: GitHub Pages is not enabled yet.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable Corepack for the pinned yarn version
        run: corepack enable
      - run: yarn install --immutable
      - name: Check the translation files
        run: yarn check:strings
      - run: yarn build
